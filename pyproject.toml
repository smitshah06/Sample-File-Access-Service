[project]
name = "sample-file-access-service"
version = "0.1.0"
description = "Controls who may download research data files, gated on access grants and QC status."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x nudges TestClient users towards httpx2; httpx still works. Test-only.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
